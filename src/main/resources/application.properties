spring.application.name=risk-auth
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/risk_auth_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (secret must be at least 32 characters)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# GeoIP + risk settings
app.geoip.db-path=${GEOIP_DB_PATH:}
app.risk.velocity-window-minutes=10

# Risk weights
app.risk.weights.new-device=35
app.risk.weights.new-country=40
app.risk.weights.unusual-hour=10
app.risk.weights.failed-attempt=8
app.risk.weights.max-failed-counted=3
app.risk.weights.ip-velocity=20
app.risk.ip-velocity-threshold=5

# Policy thresholds (score <= low-max: ALLOW, <= medium-max: STEP_UP, above: DENY)
app.risk.threshold.low-max=30
app.risk.threshold.medium-max=70

# Hard rule: failed attempts in the window that trigger a lockout
app.risk.brute-force-limit=5

# OTP
app.otp.expiry-minutes=5
app.otp.max-attempts=3

# Mail (Gmail SMTP with an App Password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# OTP delivery: false = print to console (demo), true = send email
app.otp.email-enabled=${OTP_EMAIL_ENABLED:false}

# API key for /risk/** (leave unset to disable the API)
app.risk.api-key=${RISK_API_KEY:}